# Alembic config — ADR-11 schema migrations for the shared store.
#
# The database URL is resolved at runtime by env.py from DATABASE_URL (deployed
# → Railway Postgres) or the SQLite fallback, so this file never hardcodes a
# connection string. Run: `alembic upgrade head` (deploy) or
# `alembic -c alembic.ini upgrade head` locally.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname  # overridden by env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
