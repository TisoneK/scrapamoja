# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context_ledger/core/bin/ledger-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
#
# Project notes (2026-08-18, Session 40 — core 0.8.0 init):
# - `ruff check .` is NOT a gate command: 63,650 pre-existing errors repo-wide
#   (baseline breakage; see tasks/backlog.md). The only reliable, fast, green
#   check is the betb2b suite (232 tests, next-to-code, no network).
# - The suite command goes through `git -c 'alias.…=!sh tools/gates/pytest.sh' …`
#   on purpose: ONE registry line must work on macOS (.venv/bin/python) and on
#   Windows (.venv/Scripts/python.exe, and a plain PowerShell has no POSIX PATH
#   for a bare `sh`). `git` is present in both agent shells, a `!` alias runs
#   through git's own shell, and the launcher picks the interpreter the venv
#   actually has; the older `.venv/bin/python` lines failed 127 on every
#   Windows box.
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
pre-commit|git -c 'alias.ledger-gate=!sh tools/gates/pytest.sh' ledger-gate
integration|git -c 'alias.ledger-gate=!sh tools/gates/pytest.sh' ledger-gate
exit|git -c 'alias.ledger-gate=!sh tools/gates/pytest.sh' ledger-gate
