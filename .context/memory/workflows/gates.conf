# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context/core/bin/context-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
#
# Project notes (2026-08-18, Session 40 — core 0.8.0 init):
# - Commands MUST use .venv/bin/python — plain `python` is not on PATH in
#   the agent shell and discovery found `python`/`ruff` (both 127).
# - `ruff check .` is NOT a gate command: 63,650 pre-existing errors repo-wide
#   (baseline breakage; see tasks/backlog.md). The only reliable, fast, green
#   check is the betb2b suite (232 tests, next-to-code, no network).
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
pre-commit|.venv/bin/python -m pytest src/sites/betb2b/tests/ --no-cov -q
integration|.venv/bin/python -m pytest src/sites/betb2b/tests/ --no-cov -q
exit|.venv/bin/python -m pytest src/sites/betb2b/tests/ --no-cov -q
